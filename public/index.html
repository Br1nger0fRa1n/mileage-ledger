<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mileage Ledger</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b35;
    --text: #eef0f3;
    --muted: #8b91a0;
    --accent: #4ade80;
    --debit: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 4px; }
  .balance { font-size: 48px; font-weight: 700; margin: 0 0 20px; letter-spacing: -0.02em; }
  .balance.negative { color: var(--debit); }
  .lifetime-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .lifetime-card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .lifetime-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .lifetime-card .value { font-size: 20px; font-weight: 600; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .breakdown-row:last-child { border-bottom: none; }
  .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .history-item .amount.credit { color: var(--accent); }
  .history-item .amount.debit { color: var(--debit); }
  .history-item .meta { color: var(--muted); font-size: 12px; }
  button {
    background: var(--accent); color: #0f1115; border: none; border-radius: 8px;
    padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .connect-row { margin-top: 24px; }

  .warning-banner {
    background: #3a2020; border: 1px solid #6b3232; color: #fca5a5;
    border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px;
  }
  .goal-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .goal-card .goal-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .goal-card .goal-sub { color: var(--muted); font-size: 12px; }
  .progress-track { background: #262b35; border-radius: 6px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--accent); height: 100%; transition: width 0.3s ease; }
  .goal-card.locked .progress-fill { background: #fbbf24; }
  .goal-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .goal-form input[type="text"], .goal-form input[type="number"], .goal-form input[type="date"] {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px;
  }
  .goal-form label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .category-select {
    background: var(--card); color: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; padding: 2px 6px; margin-top: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="warning-banner" id="warning-banner" style="display: none;"></div>

  <h1>Current Balance</h1>
  <div class="balance" id="balance">--</div>

  <div class="lifetime-row">
    <div class="lifetime-card">
      <div class="label">Lifetime Earned</div>
      <div class="value" id="lifetime-earned">--</div>
    </div>
    <div class="lifetime-card">
      <div class="label">Lifetime Spent</div>
      <div class="value" id="lifetime-spent">--</div>
    </div>
  </div>

  <div class="section">
    <h2>Goals</h2>
    <div id="goals-list"></div>
    <div class="goal-form">
      <input type="text" id="goal-name" placeholder="Goal name (e.g. New bike)" />
      <input type="number" id="goal-amount" placeholder="Target amount ($)" />
      <input type="date" id="goal-date" />
      <label><input type="checkbox" id="goal-locked" /> Lock this amount as a protected floor (warns if balance dips below it)</label>
      <button id="add-goal-btn">Add Goal</button>
    </div>
  </div>

  <div class="section">
    <h2>Earned by Activity</h2>
    <div id="earnings-list"></div>
  </div>

  <div class="section">
    <h2>Spent by Category</h2>
    <div id="spending-list"></div>
  </div>

  <div class="section">
    <h2>Recent Activity</h2>
    <div id="history-list"></div>
  </div>

  <div class="connect-row">
    <button id="connect-btn">Connect Bank Account</button>
  </div>
</div>

<script>
  const fmt = (n) => '$' + Number(n).toFixed(2);

  // If the session's expired or missing, bounce to the login screen
  // instead of silently showing broken/empty data.
  async function apiFetch(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401) {
      window.location.href = '/login.html';
      throw new Error('Not authenticated');
    }
    return res;
  }

  async function loadBalance() {
    const res = await apiFetch('/api/balance');
    const data = await res.json();
    const balEl = document.getElementById('balance');
    balEl.textContent = fmt(data.currentBalance);
    balEl.classList.toggle('negative', data.currentBalance < 0);
    document.getElementById('lifetime-earned').textContent = fmt(data.lifetimeEarned);
    document.getElementById('lifetime-spent').textContent = fmt(data.lifetimeSpent);
  }

  async function loadEarnings() {
    const res = await apiFetch('/api/earnings-by-type');
    const rows = await res.json();
    document.getElementById('earnings-list').innerHTML = rows.map(r =>
      `<div class="breakdown-row"><span>${r.activityType}</span><span>${fmt(r.total)}</span></div>`
    ).join('') || '<div class="breakdown-row"><span>No activities logged yet</span></div>';
  }

  async function loadSpending() {
    const res = await apiFetch('/api/spending-by-category');
    const rows = await res.json();
    document.getElementById('spending-list').innerHTML = rows.map(r =>
      `<div class="breakdown-row"><span>${r.category}</span><span>${fmt(r.total)}</span></div>`
    ).join('') || '<div class="breakdown-row"><span>No purchases yet</span></div>';
  }

  const CATEGORIES = ['Food and Drink', 'Shopping', 'Entertainment', 'Transportation', 'Bills', 'Travel', 'Other', 'Uncategorized'];

  async function loadHistory() {
    const res = await apiFetch('/api/history?limit=20');
    const rows = await res.json();
    document.getElementById('history-list').innerHTML = rows.map(r => `
      <div class="history-item">
        <div>
          <div>${r.label}</div>
          <div class="meta">${new Date(r.occurred_at).toLocaleDateString()}</div>
          ${r.kind === 'debit' ? `
            <select class="category-select" data-id="${r.id}" onchange="updateCategory(${r.id}, this.value)">
              ${CATEGORIES.map(c => `<option value="${c}" ${c === r.category ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          ` : ''}
        </div>
        <div class="amount ${r.kind}">${r.kind === 'debit' ? '-' : '+'}${fmt(r.amount)}</div>
      </div>
    `).join('') || '<div class="history-item"><span>Nothing yet</span></div>';
  }

  async function updateCategory(transactionId, category) {
    await apiFetch(`/api/transactions/${transactionId}/category`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category }),
    });
    loadSpending(); // category breakdown needs to reflect the change
  }
  window.updateCategory = updateCategory; // exposed for the inline onchange handler above

  async function loadGoals() {
    const res = await apiFetch('/api/goals');
    const goals = await res.json();
    document.getElementById('goals-list').innerHTML = goals.map(g => `
      <div class="goal-card ${g.locked ? 'locked' : ''}">
        <div class="goal-top">
          <span>${g.name}${g.locked ? ' 🔒' : ''}${g.achieved ? ' ✅' : ''}</span>
          <span>${fmt(Math.min(g.progressPct >= 100 ? g.targetAmount : (g.progressPct / 100) * g.targetAmount, g.targetAmount))} / ${fmt(g.targetAmount)}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width: ${Math.min(g.progressPct, 100)}%"></div></div>
        ${g.targetDate ? `<div class="goal-sub">Target: ${new Date(g.targetDate).toLocaleDateString()}</div>` : ''}
      </div>
    `).join('') || '<div class="goal-sub">No goals yet — add one below.</div>';
  }

  async function loadWarnings() {
    const res = await apiFetch('/api/goal-warnings');
    const warnings = await res.json();
    const banner = document.getElementById('warning-banner');
    if (warnings.length === 0) {
      banner.style.display = 'none';
      return;
    }
    banner.style.display = 'block';
    banner.innerHTML = warnings.map(w =>
      `⚠️ Balance is $${w.shortfall.toFixed(2)} below your locked goal "${w.goalName}" ($${w.targetAmount.toFixed(2)})`
    ).join('<br>');
  }

  document.getElementById('add-goal-btn').addEventListener('click', async (e) => {
    e.preventDefault();
    const name = document.getElementById('goal-name').value.trim();
    const targetAmount = parseFloat(document.getElementById('goal-amount').value);
    const targetDate = document.getElementById('goal-date').value || null;
    const locked = document.getElementById('goal-locked').checked;

    if (!name || !targetAmount) {
      alert('Give the goal a name and a target amount.');
      return;
    }

    await apiFetch('/api/goals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, targetAmount, targetDate, locked }),
    });

    document.getElementById('goal-name').value = '';
    document.getElementById('goal-amount').value = '';
    document.getElementById('goal-date').value = '';
    document.getElementById('goal-locked').checked = false;
    loadGoals();
    loadWarnings();
  });

  function refreshAll() {
    loadBalance();
    loadEarnings();
    loadSpending();
    loadHistory();
    loadGoals();
    loadWarnings();
  }

  refreshAll();
  setInterval(refreshAll, 30000); // poll every 30s for near-live updates

  document.getElementById('connect-btn').addEventListener('click', async () => {
    const res = await fetch('/plaid/link-token', { method: 'POST' });
    const { link_token } = await res.json();

    const handler = Plaid.create({
      token: link_token,
      onSuccess: async (public_token) => {
        await fetch('/plaid/exchange-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ public_token }),
        });
        alert('Bank connected!');
      },
    });
    handler.open();
  });
</script>
</body>
</html>
