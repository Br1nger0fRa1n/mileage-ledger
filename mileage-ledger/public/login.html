<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mileage Ledger — Login</title>
<style>
  :root { --bg: #0f1115; --card: #171a21; --border: #262b35; --text: #eef0f3; --muted: #8b91a0; --accent: #4ade80; --error: #f87171; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card { width: 100%; max-width: 320px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px;
  }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #0f1115; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .error { color: var(--error); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Mileage Ledger</h1>
  <form id="login-form">
    <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password" />
    <button type="submit">Unlock</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json();
      errorEl.textContent = data.error || 'Login failed';
    }
  });
</script>
</body>
</html>
